<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AICT Lab · Week 1 · Reel</title>
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:255}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden}
body{display:grid;place-items:center;color:#f5f5f7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.stage{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));container-type:size;overflow:hidden;background:#07070b;--h:255;transition:--h 1.4s ease;border-radius:2vmin}
@supports (height:100dvh){.stage{width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9))}}
@media (max-aspect-ratio:9/16){.stage{border-radius:0}}

/* ambient background */
.blob{position:absolute;width:130cqw;height:130cqw;border-radius:50%;animation:drift 15s ease-in-out infinite alternate;pointer-events:none}
.b1{left:-55cqw;top:-45cqw;background:radial-gradient(circle,hsl(var(--h) 90% 56% / .55),transparent 65%)}
.b2{right:-65cqw;bottom:-50cqw;background:radial-gradient(circle,hsl(calc(var(--h) + 60) 90% 55% / .42),transparent 65%);animation-duration:21s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(16cqw,22cqw) scale(1.18)}}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* hud */
.hud{position:absolute;top:0;left:0;right:0;z-index:20;padding:3cqw 4.5cqw 0;pointer-events:none}
.segs{display:flex;gap:1cqw}
.seg{flex:1;height:.75cqw;border-radius:1cqw;background:#ffffff30;overflow:hidden}
.seg i{display:block;height:100%;width:0;background:#fff}
.hrow2{display:flex;justify-content:space-between;align-items:center;margin-top:2.4cqw}
.hrow2 span{font-size:2.7cqw;letter-spacing:.2em;text-transform:uppercase;color:#ffffffa0}
#mute{pointer-events:auto;background:none;border:0;color:#fff;font-size:3.6cqw;cursor:pointer;opacity:.85;padding:1cqw 1.5cqw}
.pz{position:absolute;inset:0;z-index:15;display:none;place-items:center;font-size:16cqw;color:#ffffffcc;pointer-events:none;text-shadow:0 0 6cqw #000a}
.paused .pz{display:grid}
.paused *{animation-play-state:paused!important}

/* scene container */
#sc{position:absolute;inset:0;padding:15cqw 8cqw 9cqw;display:flex;flex-direction:column;justify-content:center;gap:3.5cqw;z-index:5}

/* type system */
.kick{font-size:3cqw;letter-spacing:.22em;text-transform:uppercase;color:hsl(var(--h) 95% 74%);font-weight:700}
.big{font-size:28cqw;font-weight:800;letter-spacing:-.06em;line-height:.9;display:flex}
.mid{font-size:13.5cqw;font-weight:800;letter-spacing:-.045em;line-height:.98}
.mid2{font-size:9cqw;font-weight:800;letter-spacing:-.04em;line-height:1}
.sm{font-size:3.9cqw;line-height:1.4;color:#ffffffb8}
.acc{color:hsl(var(--h) 95% 72%)}
.fade{opacity:0;transform:translateY(2.4cqw);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.fade.in{opacity:1;transform:none}
.ml{overflow:hidden;padding-bottom:.14em}
.ml>span{display:block;transform:translateY(112%);transition:transform .95s cubic-bezier(.2,.8,.2,1)}
.ml.in>span{transform:none}
.ch{display:inline-block;opacity:0;transform:translateY(50%) rotate(7deg);transition:all 1s cubic-bezier(.2,.8,.2,1)}
.ch.in{opacity:1;transform:none}
.rule{height:.7cqw;width:0;border-radius:1cqw;background:linear-gradient(90deg,hsl(var(--h) 95% 68%),hsl(calc(var(--h) + 70) 95% 70%));transition:width 1.5s cubic-bezier(.2,.8,.2,1)}
.rule.in{width:42cqw}
.rise{animation:rise .75s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(4.5cqw)}}
.dim{opacity:.28;transition:opacity .7s}

/* scene 2 */
.row2{transition:opacity .7s}

/* scene 3 */
.jr{position:relative;width:100%;height:88cqw;margin-top:1cqw}
.jr::before{content:"";position:absolute;left:50%;top:9cqw;bottom:9cqw;border-left:.5cqw dashed #ffffff30}
.jn{position:absolute;left:50%;transform:translateX(-50%);width:62cqw;height:18cqw;border-radius:4cqw;border:.4cqw solid #ffffff26;background:#0a0a12cc;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.5s;z-index:2}
.jn.on{border-color:hsl(var(--h) 95% 66%);background:hsl(var(--h) 70% 30% / .6);box-shadow:0 0 8cqw hsl(var(--h) 90% 55% / .35)}
.jn b{font-size:4.6cqw}.jn small{font-size:3cqw;color:#ffffff98}
.pkt{position:absolute;left:50%;top:9cqw;transform:translate(-50%,-50%);padding:1.5cqw 3.6cqw;border-radius:5cqw;background:hsl(var(--h) 95% 68%);color:#07070b;font-weight:800;font-size:3.3cqw;white-space:nowrap;opacity:0;z-index:4;transition:top 1.25s cubic-bezier(.6,0,.3,1),opacity .35s}
.cap{font-size:6.6cqw;font-weight:800;letter-spacing:-.03em;line-height:1.08}

/* scene 4 */
.cp{min-height:29cqw}
.cp .kick{margin-bottom:1.6cqw;min-height:4cqw}
.code{background:#00000070;border:.3cqw solid #ffffff1f;border-radius:3cqw;padding:3cqw 3.5cqw;font-size:3.35cqw;line-height:1.55;overflow:hidden}
.code div{white-space:pre;min-height:1.55em;color:#ffffffc4}
.t{color:hsl(var(--h) 95% 76%)}.a{color:#ffd479}.s{color:#8ff0b5}
.car{display:inline-block;width:.55em;height:1.1em;background:hsl(var(--h) 95% 70%);vertical-align:-.2em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.br{background:#f4f4f6;color:#111;border-radius:3cqw;overflow:hidden;opacity:0;transform:translateY(3cqw);transition:all .7s cubic-bezier(.2,.8,.2,1)}
.br.in{opacity:1;transform:none}
.br .bar{background:#d9dae2;height:7cqw;display:flex;align-items:flex-end;padding:0 3cqw}
.br .tab{background:#f4f4f6;border-radius:2cqw 2cqw 0 0;height:5.4cqw;padding:0 3cqw;font-size:2.6cqw;display:flex;align-items:center;min-width:30cqw;color:#555}
.br .pg{padding:3cqw 4cqw;min-height:19cqw;font-family:Georgia,"Times New Roman",serif}
.br h1{font-size:6.4cqw;opacity:0;transition:opacity .7s,transform .7s;transform:translateY(2cqw)}
.br p{font-size:3.4cqw;opacity:0;transition:opacity .7s,transform .7s;transform:translateY(2cqw)}
.br h1.in,.br p.in{opacity:1;transform:none}

/* scene 5 */
.an{font-size:4.8cqw;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.pt{transition:all .45s;border-radius:1cqw;padding:.8cqw .1cqw}
.pt.dim{opacity:.22}
.pt.on{background:hsl(var(--h) 90% 60% / .3);box-shadow:0 0 0 .7cqw hsl(var(--h) 90% 60% / .3)}

/* scene 6 */
.hrow{display:flex;align-items:baseline;gap:3cqw}
.hrow code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:3cqw;color:hsl(var(--h) 95% 74%);width:8cqw;flex:none}
.hrow .ml{font-weight:800;letter-spacing:-.035em;line-height:1.05}

/* scene 7 */
.lab{font-size:2.7cqw;letter-spacing:.2em;text-transform:uppercase;color:#ffffff80;margin-bottom:1.6cqw}
.cbox{background:#00000070;border:.3cqw solid #ffffff1f;border-radius:3cqw;padding:3.5cqw;font-size:4cqw;line-height:1.5;min-height:36cqw}
.cbox div{white-space:pre}
.obox{background:#f4f4f6;color:#111;border-radius:3cqw;padding:3.5cqw;font-family:Georgia,"Times New Roman",serif;font-size:5.4cqw;min-height:27cqw}
.obox p{margin:0}.obox pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:4.6cqw;margin:0}

/* scene 8 */
.sent{font-size:6.2cqw;line-height:1.6;font-weight:600;letter-spacing:-.01em}
em.d,strong.d,mark.d,del.d,ins.d,sup.d,sub.d{font-style:normal;font-weight:inherit;background:none;color:inherit;text-decoration:none;font-size:inherit;vertical-align:baseline;line-height:inherit}
mark{padding:0 .6cqw;border-radius:.8cqw}
.fl{animation:fl 1s}
@keyframes fl{0%{outline:.7cqw solid hsl(var(--h) 95% 66%);outline-offset:.6cqw}100%{outline:.7cqw solid transparent;outline-offset:1cqw}}
.pillrow{display:flex;gap:2.4cqw;align-items:center;min-height:11cqw}
.pill{font-size:4.2cqw;padding:1.5cqw 3.2cqw;border-radius:3cqw;background:hsl(var(--h) 80% 55% / .24);color:hsl(var(--h) 95% 80%)}
.tagk{font-size:2.8cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:1.3cqw 2.5cqw;border-radius:2cqw}
.tagk.m{background:#4ade8033;color:#86efac}.tagk.l{background:#fbbf2433;color:#fcd34d}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.cc{border-radius:4cqw;padding:5cqw 4cqw;background:#ffffff10;border:.3cqw solid #ffffff22}
.cc h4{font-size:3cqw;letter-spacing:.16em;text-transform:uppercase;color:#ffffffa0}
.cc p{font-size:6cqw;margin-top:2.5cqw;font-weight:700;line-height:1.3}
.cc .acc2{color:#86efac}.cc .acc3{color:#fcd34d}

/* scene 9 */
.fcard{position:relative;border-radius:5cqw;border:.5cqw solid #ffffff30;background:#ffffff0d;padding:13cqw 4cqw 9cqw;text-align:center;transition:all .4s;margin-top:4cqw}
.fcard.bad{border-color:#fb7185;background:#fb718522}
.fcard.good{border-color:#4ade80;background:#4ade8022}
.fn{font-size:7cqw;font-weight:700;word-break:break-all}
.stamp{position:absolute;top:-5.5cqw;right:5cqw;width:13cqw;height:13cqw;border-radius:50%;display:grid;place-items:center;font-size:7.5cqw;font-weight:800;transform:scale(0) rotate(-35deg);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.fcard.bad .stamp{background:#fb7185;color:#2a0510;transform:none}
.fcard.good .stamp{background:#4ade80;color:#052e12;transform:none}
.rs{display:flex;gap:2cqw;flex-wrap:wrap;justify-content:center;margin-top:5cqw;min-height:9cqw}
.rs span{font-size:3.5cqw;padding:1.3cqw 3.2cqw;border-radius:5cqw;background:#ffffff16}
.rules{display:flex;flex-wrap:wrap;gap:2cqw}
.rules span{font-size:3.4cqw;padding:1.3cqw 3cqw;border-radius:5cqw;background:hsl(var(--h) 70% 50% / .22);color:hsl(var(--h) 95% 80%);opacity:0;transform:translateY(2cqw);transition:all .6s cubic-bezier(.2,.8,.2,1)}
.rules span.in{opacity:1;transform:none}

/* scene 10 */
.cnt{font-size:2.8cqw;letter-spacing:.2em;color:#ffffff80}
.qq{font-size:9.2cqw;font-weight:800;letter-spacing:-.04em;line-height:1.04;min-height:44cqw}
.qq .mono{font-size:.8em;letter-spacing:-.02em;color:hsl(var(--h) 95% 74%)}
.aa{font-size:5cqw;font-weight:600;line-height:1.38;padding:5cqw;border-radius:4cqw;background:hsl(var(--h) 80% 55% / .2);border-left:1cqw solid hsl(var(--h) 95% 68%);min-height:31cqw}
.aa .mono{font-size:.88em;color:hsl(var(--h) 95% 80%)}

/* scene 11 */
.ck{display:flex;align-items:center;gap:4cqw;font-size:5cqw;font-weight:600;opacity:.4;transition:opacity .6s}
.ck.in{opacity:1}
.tick{width:9cqw;height:9cqw;border-radius:50%;border:.5cqw solid #ffffff40;display:grid;place-items:center;font-size:5cqw;color:transparent;flex:none;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.ck.in .tick{background:hsl(var(--h) 90% 62%);border-color:transparent;color:#04130d;transform:scale(1.08)}
.rp{margin-top:3cqw;align-self:flex-start;background:#fff;color:#07070b;border:0;border-radius:6cqw;padding:3cqw 7cqw;font-size:4.2cqw;font-weight:800;cursor:pointer}

/* start overlay */
.start{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;gap:3.5cqw;padding:10cqw;background:#07070bd6;backdrop-filter:blur(2cqw)}
.start .big{font-size:30cqw;color:#fff}
.go{margin-top:4cqw;align-self:flex-start;background:#fff;color:#07070b;border:0;border-radius:7cqw;padding:3.4cqw 8cqw;font-size:4.6cqw;font-weight:800;cursor:pointer}
.hint{font-size:3.3cqw;color:#ffffff90;line-height:1.6}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div id="sc"></div>
  <div class="grain"></div>
  <div class="hud">
    <div class="segs" id="segs"></div>
    <div class="hrow2"><span>AICT Lab · Week 1</span><button id="mute" aria-label="Toggle sound">sound on</button></div>
  </div>
  <div class="pz">❚❚</div>
  <div class="start" id="start">
    <div class="kick">AICT Lab · Week 1</div>
    <div class="big">HTML</div>
    <div class="hint">A short reel of everything in Lab 01.<br>Tap right = next · tap left = back · hold = pause</div>
    <button class="go" id="go">▶ Play with sound</button>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
function el(tag,cls,html,parent){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||SC).appendChild(e);return e}
var SC=$('#sc'),stage=$('#stage');

/* ---------- sound: ambient pad + tiny sfx, all synthesized ---------- */
var S=(function(){
  var ac=null,master=null,nb=null,padG=null,oscs=[],muted=false;
  var f=function(m){return 440*Math.pow(2,(m-69)/12)};
  var CH=[[57,60,64],[53,57,60],[48,55,60],[55,59,62]];
  function ok(){return ac&&!muted}
  return {
    init:function(){
      if(ac)return;
      try{
        ac=new (window.AudioContext||window.webkitAudioContext)();
        master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
        nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
        var d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
        var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;
        padG=ac.createGain();padG.gain.value=0;padG.gain.linearRampToValueAtTime(.05,ac.currentTime+3);
        padG.connect(lp);lp.connect(master);
        for(var k=0;k<3;k++){var o=ac.createOscillator();o.type='sine';o.frequency.value=220;o.detune.value=(Math.random()-.5)*10;o.connect(padG);o.start();oscs.push(o)}
      }catch(e){ac=null}
    },
    chord:function(i){if(!ac)return;var c=CH[i%4];oscs.forEach(function(o,k){o.frequency.setTargetAtTime(f(c[k]),ac.currentTime,.7)})},
    blip:function(m,v){
      if(!ok())return;var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.value=f(m);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+.55);
    },
    key:function(){
      if(!ok())return;var t=ac.currentTime,s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain();
      s.buffer=nb;b.type='bandpass';b.frequency.value=2200+Math.random()*900;b.Q.value=1.2;
      g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);
      s.connect(b);b.connect(g);g.connect(master);s.start(t,Math.random()*.5,.05);
    },
    whoosh:function(){
      if(!ok())return;var t=ac.currentTime,s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain();
      s.buffer=nb;b.type='bandpass';b.Q.value=.8;b.frequency.setValueAtTime(300,t);b.frequency.exponentialRampToValueAtTime(2600,t+.35);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+.4);
      s.connect(b);b.connect(g);g.connect(master);s.start(t,0,.45);
    },
    stamp:function(good){
      if(!ok())return;var t=ac.currentTime;
      if(good){S.blip(76,.06);setTimeout(function(){S.blip(83,.06)},110)}
      else{var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(55,t+.22);
        g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3)}
    },
    mute:function(v){muted=v;if(master)master.gain.setTargetAtTime(v?0:.9,ac.currentTime,.05)},
    isMuted:function(){return muted},
    pause:function(v){if(!ac)return;try{v?ac.suspend():ac.resume()}catch(e){}}
  };
})();

/* ---------- syntax highlight ---------- */
function hl(line){
  var s=esc(line);
  return s.replace(/&lt;(\/?)([!\w]+)((?:(?!&gt;)[\s\S])*)&gt;/g,function(m,sl,name,rest){
    rest=rest.replace(/([\w-]+)=("[^"]*")/g,'<span class="a">$1</span>=<span class="s">$2</span>');
    return '<span class="t">&lt;'+sl+name+'</span>'+rest+'<span class="t">&gt;</span>';
  });
}

/* ---------- timeline engine ---------- */
var scenes=[],idx=-1,clock=0,dur=1,sched=[],paused=false,started=false,last=0,holdPause=false;
var segsEl=$('#segs'),segs=[];
function R(elm,ms,T){T.at(ms,function(){elm.classList.add('in')})}

function go(i){
  i=Math.max(0,Math.min(scenes.length-1,i));
  if(idx>=0&&i!==idx)S.whoosh();
  idx=i;clock=0;sched=[];SC.innerHTML='';
  var sd=scenes[i];dur=sd.dur;
  stage.style.setProperty('--h',sd.h);
  S.chord(i);
  var T={
    at:function(ms,fn){sched.push({t:ms,fn:fn});sched.sort(function(a,b){return a.t-b.t})},
    dur:function(ms){dur=ms;sd.dur=ms}
  };
  sd.run(SC,T);
  segs.forEach(function(s,k){s.firstChild.style.width=k<i?'100%':'0%'});
}
function next(){if(idx<scenes.length-1)go(idx+1)}
function prev(){if(clock>1500)go(idx);else go(idx-1)}
function tick(ts){
  var dt=Math.min(64,ts-(last||ts));last=ts;
  if(started&&!paused&&idx>=0){
    clock+=dt;
    while(sched.length&&sched[0].t<=clock){var s=sched.shift();try{s.fn()}catch(e){console.error(e)}}
    segs[idx].firstChild.style.width=Math.min(100,clock/dur*100)+'%';
    if(clock>=dur&&idx<scenes.length-1)go(idx+1);
  }
  requestAnimationFrame(tick);
}
function setPaused(v){paused=v;stage.classList.toggle('paused',v);S.pause(v)}

/* ---------- scenes ---------- */
var L=[
  ['<!DOCTYPE html>','DOCTYPE','Tells the browser: this is HTML5. Always line one.'],
  ['<html lang="en">','html','The root. It wraps the whole page.'],
  ['  <head>','head','Info about the page. Not shown on it.'],
  ['    <meta charset="UTF-8">','charset','Shows every character right, even Urdu.'],
  ['    <meta name="viewport"','viewport','Fits the page to a phone screen.'],
  ['      content="width=device-width,',null,null,'      <span class="a">content</span>=<span class="s">"width=device-width,</span>'],
  ['      initial-scale=1.0">',null,null,'      <span class="s">initial-scale=1.0"</span><span class="t">&gt;</span>'],
  ['    <title>My First Webpage</title>','title','This text shows on the browser tab.'],
  ['  </head>','nesting','Close tags in the reverse order you opened them.'],
  ['  <body>','body','Everything you can see lives in here.'],
  ['    <h1>Hello, World!</h1>','h1','The main heading. One per page.'],
  ['    <p>This is my first webpage.</p>','p','A paragraph.'],
  ['  </body>',null,null],
  ['</html>',null,null]];
var NOTES=[69,72,74,76,79];

var QA=[
  ['Tag vs element?','A tag is <span class="mono">&lt;p&gt;</span>. An element is the opening tag + content + closing tag together.'],

/* ---------- ui wiring ---------- */
scenes.forEach(function(){var s=document.createElement('div');s.className='seg';s.innerHTML='<i></i>';segsEl.appendChild(s);segs.push(s)});
$('#go').onclick=function(){S.init();started=true;$('#start').style.display='none';go(0)};
$('#mute').onclick=function(e){e.stopPropagation();var m=!S.isMuted();S.mute(m);this.textContent=m?'sound off':'sound on'};
var down=false,holdT=null,held=false;
stage.addEventListener('pointerdown',function(e){
  if(!started||e.target.closest('button'))return;
  down=true;held=false;clearTimeout(holdT);holdT=setTimeout(function(){held=true;setPaused(true)},260);
});
stage.addEventListener('pointerup',function(e){
  if(!down)return;down=false;clearTimeout(holdT);
  if(held){setPaused(false);return}
  var r=stage.getBoundingClientRect();
  if(e.clientX-r.left<r.width*.3)prev();else next();
});
stage.addEventListener('pointercancel',function(){down=false;clearTimeout(holdT);if(held)setPaused(false)});
document.addEventListener('keydown',function(e){
  if(!started)return;
  if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key===' '){e.preventDefault();setPaused(!paused)}
  else if(e.key==='m'||e.key==='M')$('#mute').click();
});
document.addEventListener('visibilitychange',function(){if(!started)return;if(document.hidden)setPaused(true);else if(!held)setPaused(false)});
requestAnimationFrame(tick);
})();
